<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>

    <div class="outer-box">

        <h2 class="title">Responsive Product Grid</h2>

        <div class="container">

            <div class="card">
                <img src="https://via.placeholder.com/80" alt="Product 1">
                <h3>Product 1</h3>
                <p>High-quality item with great features.</p>
                <h4>₹499</h4>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/80" alt="Product 2">
                <h3>Product 2</h3>
                <p>Durable and stylish for daily use.</p>
                <h4>₹799</h4>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/80" alt="Product 3">
                <h3>Product 3</h3>
                <p>Lightweight and comfortable.</p>
                <h4>₹1,299</h4>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/80" alt="Product 4">
                <h3>Product 4</h3>
                <p>Trendy design with premium quality.</p>
                <h4>₹999</h4>
            </div>

        </div>
    </div>

</body>
</html>
