<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 50px;
            text-align: center;
        }

        .main-box {
            border: 3px solid black;
            padding: 30px;
            width: 80%;
            margin: auto;
            background: white;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .card {
            background: #ffffff;
            padding: 20px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .circle {
            width: 60px;
            height: 60px;
            background: #007bff;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            margin: auto;
        }

        .name {
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
        }

        .details {
            font-size: 14px;
            color: #444;
            margin-top: 3px;
        }

    </style>
</head>

<body>

    <div class="main-box">

        <div class="card-container">

            
            <div class="card">
                <div class="circle">JK</div>
                <div class="name">Jeet Kumar</div>
                <div class="details">B.Tech - CSE</div>
                <div class="details">Roll No: 21CS1007</div>
                <div class="details">1st Year</div>
            </div>

            
            <div class="card">
                <div class="circle">AR</div>
                <div class="name">Asha Rani</div>
                <div class="details">B.Tech - IT</div>
                <div class="details">Roll No: 21IT1102</div>
                <div class="details">1st Year</div>
            </div>

            
            <div class="card">
                <div class="circle">RK</div>
                <div class="name">Rohit Kumar</div>
                <div class="details">B.Tech - ECE</div>
                <div class="details">Roll No: 21EC1009</div>
                <div class="details">1st Year</div>
            </div>

        </div>

    </div>

</body>
</html>
